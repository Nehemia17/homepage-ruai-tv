<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — RUAI TV</title>
  
  <!-- Favicon & Styles -->
  <link rel="icon" href="/assets/images/logo ruai.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/assets/css/admin.css" />
</head>
<body class="login-page-body">

  <div class="login-card-wrapper">
    <div class="login-brand-header">
      <img src="/assets/images/logo ruai.png" alt="Ruai TV Logo" onerror="this.style.display='none';" />
      <h1 class="login-brand-title">RUAI TV ADMIN</h1>
      <p class="login-brand-subtitle">Masuk untuk mengelola katalog & siaran program</p>
    </div>

    <!-- Alert Box for Login Errors -->
    <div class="login-alert-box" id="login-alert-box">
      <span class="login-alert-icon">!</span> <span id="login-alert-text">Email atau password salah.</span>
    </div>

    <form id="login-form">
      <div class="login-form-group">
        <label for="login-username">Email Admin</label>
        <div class="login-input-wrap">
          <input type="email" id="login-username" placeholder="Masukkan email admin..." required autocomplete="username" autofocus />
        </div>
      </div>

      <div class="login-form-group">
        <label for="login-password">Password</label>
        <div class="login-input-wrap">
          <input type="password" id="login-password" placeholder="Masukkan password..." required autocomplete="current-password" />
          <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Tampilkan/Sembunyikan Password" aria-label="Tampilkan password" tabindex="-1">
            <svg class="icon icon-show" aria-hidden="true" focusable="false"><use href="/admin/assets/icons.svg#eye"></use></svg><svg class="icon icon-hide" aria-hidden="true" focusable="false"><use href="/admin/assets/icons.svg#eye-off"></use></svg>
          </button>
        </div>
      </div>

      <div class="login-options-row">
        <label class="login-remember-me">
          <input type="checkbox" id="login-remember" checked />
          <span>Ingat Saya</span>
        </label>
        <a href="#" class="login-forgot-link" id="link-forgot-pass">Lupa Password?</a>
      </div>

      <button type="submit" class="btn-login-submit" id="btn-login">
        <span>Masuk ke Admin Panel</span>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="/admin/assets/icons.svg#arrow-right"></use></svg>
      </button>
    </form>

    <div class="login-footer-info">
      <p>&copy; 2026 PT. Ruai Televisi — System Secured</p>
      <p class="login-footer-link"><a href="/" class="login-back-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="/admin/assets/icons.svg#arrow-left"></use></svg> Kembali ke Website Utama</a></p>
    </div>
  </div>

  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <!-- Login Script -->
  <script src="/admin/assets/js/login.js"></script>
</body>
</html>
